name: TransitPulse CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Display .NET version
        run: dotnet --version

      - name: Restore Dependencies
        run: dotnet restore TransitPulse.slnx

      - name: Build Solution
        run: dotnet build TransitPulse.slnx --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test TransitPulse.slnx --no-build --configuration Release --verbosity normal
